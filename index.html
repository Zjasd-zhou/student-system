<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生成绩管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .top-logo {
            position: absolute;
            top: 40px;
            left: 60px;
        }

        .logo-text {
            font-size: 36px;
            font-weight: 700;
            color: #2a5298;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .logo-text::first-letter {
            color: #e74c3c;
        }

        .logo-slogan {
            font-size: 14px;
            color: #999;
            letter-spacing: 1px;
            font-style: italic;
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            background: #fff;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .login-header {
            padding: 30px 40px 10px;
        }

        .login-header h1 {
            font-size: 18px;
            color: #333;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .login-form {
            padding: 10px 40px 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #dfe1e5;
            border-radius: 4px;
            background: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .login-btn {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 4px;
            background: #4a90e2;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            font-family: inherit;
        }

        .login-btn:hover {
            background: #3a7bd5;
        }

        #tip {
            text-align: center;
            font-size: 13px;
            margin-top: 14px;
            height: 18px;
        }

        .forgot {
            display: block;
            font-size: 13px;
            color: #4a90e2;
            text-decoration: none;
            margin-top: 12px;
            cursor: pointer;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .page-corner-img {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 200px;
            pointer-events: none;
            z-index: 10;
        }

        .footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 13px;
            color: #999;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .top-logo {
                top: 20px;
                left: 20px;
            }
            .logo-text {
                font-size: 24px;
            }
            .page-corner-img {
                width: 120px;
            }
        }
    </style>
</head>
<body>

    <div class="top-logo">
        <h1 class="logo-text">Ikean</h1>
        <p class="logo-slogan">学生成绩管理系统</p>
    </div>

    <div class="login-box">

        <div class="login-header">
            <h1>学生成绩管理系统</h1>
        </div>

        <div class="login-form">

            <div class="form-group">
                <input type="text" id="username" placeholder="请输入账号">
            </div>

            <div class="form-group">
                <input type="password" id="password" placeholder="请输入密码">
            </div>

            <button class="login-btn" id="myBtn">登 录</button>

            <a class="forgot" id="visitorBtn">游客进入</a>

            <div id="tip"></div>

        </div>

    </div>

    <img src="img.png" class="page-corner-img">

    <div class="footer">Copyright © 2026 Ikean</div>

    <script>
        const CORRECT_USER = "Admin123";
        const CORRECT_PASS = "1234";

        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const btn = document.getElementById("myBtn");
        const visitorBtn = document.getElementById("visitorBtn");
        const tip = document.getElementById("tip");

        btn.addEventListener("click", function () {
            const user = usernameInput.value.trim();
            const pass = passwordInput.value;

            if (user === CORRECT_USER && pass === CORRECT_PASS) {
                tip.textContent = "登录成功";
                tip.style.color = "#27ae60";
                localStorage.setItem("checkAdmin", "1");
                window.location.href = "main.html";
            } else {
                tip.textContent = "账号或密码错误";
                tip.style.color = "#e74c3c";
            }
        });

        visitorBtn.addEventListener("click", function () {
            localStorage.setItem("checkAdmin", "0");
            window.location.href = "main.html";
        });

        document.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                btn.click();
            }
        });
    </script>

</body>
</html>
